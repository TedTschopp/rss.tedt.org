<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin: 0; padding: 20px; } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Badge, Tag, Input } = window.RSSFeedHubDesignSystem_2f2da6;

function Row({ label, children }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" }}>
      <span style={{ fontFamily: "var(--font-mono)", fontSize: "10px", color: "var(--text-faint)", width: "62px", flex: "none" }}>{label}</span>
      {children}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <div style={{ display: "flex", flexDirection: "column", gap: "14px" }}>
    <Row label="button">
      <Button variant="primary" icon="fas fa-rss">Subscribe</Button>
      <Button variant="accent">Accent</Button>
      <Button variant="outline">Outline</Button>
      <Button variant="outline-accent">Accent</Button>
      <Button variant="outline-ink">Ink</Button>
      <Button variant="ghost">Ghost</Button>
      <Button variant="primary" disabled>Disabled</Button>
    </Row>
    <Row label="sizes">
      <Button size="sm" variant="outline">Small</Button>
      <Button size="md" variant="outline">Medium</Button>
      <Button size="lg" variant="outline">Large</Button>
      <Button size="sm" variant="outline-ink" icon="fas fa-copy">Copy</Button>
    </Row>
    <Row label="badge">
      <Badge kind="essential" />
      <Badge kind="important" />
      <Badge kind="optional" />
      <Badge kind="tech-transformational" />
      <Badge kind="tech-important" />
      <Badge kind="tech-informational" />
    </Row>
    <Row label="tag">
      <Tag>AI Labs</Tag>
      <Tag>Hacker News</Tag>
      <Tag active>Reddit</Tag>
      <Tag>arXiv</Tag>
      <Tag>Newsletters</Tag>
    </Row>
    <Row label="input">
      <div style={{ flex: 1 }}><Input placeholder="Search feeds" /></div>
      <div style={{ flex: 1.4 }}><Input copyable size="sm" defaultValue="https://rss.tedt.org/ai_rss_feed.xml" /></div>
    </Row>
  </div>
);
</script>
</body>
</html>
