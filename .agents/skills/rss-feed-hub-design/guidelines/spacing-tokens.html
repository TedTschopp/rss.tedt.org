<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Tokens" subtitle="4px base with big jumps — 4 to 128" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; display: flex; align-items: flex-end; gap: 14px; }
  .t { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--navy-500); width: 22px; }
  .m { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="t"><div class="bar" style="height: 4px;"></div><span class="m">4</span></div>
  <div class="t"><div class="bar" style="height: 8px;"></div><span class="m">8</span></div>
  <div class="t"><div class="bar" style="height: 12px;"></div><span class="m">12</span></div>
  <div class="t"><div class="bar" style="height: 16px;"></div><span class="m">16</span></div>
  <div class="t"><div class="bar" style="height: 24px;"></div><span class="m">24</span></div>
  <div class="t"><div class="bar" style="height: 32px;"></div><span class="m">32</span></div>
  <div class="t"><div class="bar" style="height: 48px;"></div><span class="m">48</span></div>
  <div class="t"><div class="bar" style="height: 64px;"></div><span class="m">64</span></div>
  <div class="t"><div class="bar" style="height: 96px;"></div><span class="m">96</span></div>
  <div class="t"><div class="bar" style="height: 118px; background: var(--orange-500);"></div><span class="m">128</span></div>
</body>
</html>
