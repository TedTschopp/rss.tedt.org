<!-- @dsCard group="Colors" viewport="700x140" name="Feed Formats" subtitle="Brand-fixed syndication colors — never repurposed" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; display: flex; gap: 12px; }
  .sw { flex: 1; height: 100px; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; color: #fff; }
  .name { font-family: var(--font-mono); font-weight: 600; font-size: 13px; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.85; }
</style>
</head>
<body>
  <div class="sw" style="background: var(--format-rss2);"><span class="name">RSS 2.0</span><span class="hex">#FF6600</span></div>
  <div class="sw" style="background: var(--format-rss1);"><span class="name">RSS 1.0</span><span class="hex">#F88920</span></div>
  <div class="sw" style="background: var(--format-atom);"><span class="name">ATOM</span><span class="hex">#8B5CF6</span></div>
  <div class="sw" style="background: var(--format-json); color: var(--format-json-gold);"><span class="name">JSON</span><span class="hex">#292929 · #F5A623</span></div>
</body>
</html>
