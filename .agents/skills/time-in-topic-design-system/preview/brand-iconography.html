<!doctype html><html><head><meta charset="utf-8"><title>Iconography</title><link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script></head>
<body><div class="card">
<div class="note">Lucide · 1.5px stroke · CDN</div>
<div class="row" style="gap:18px;color:var(--fg)">
<i data-lucide="arrow-up-right" style="width:24px;height:24px"></i>
<i data-lucide="arrow-right" style="width:24px;height:24px"></i>
<i data-lucide="bookmark" style="width:24px;height:24px"></i>
<i data-lucide="share-2" style="width:24px;height:24px"></i>
<i data-lucide="clock" style="width:24px;height:24px"></i>
<i data-lucide="calendar" style="width:24px;height:24px"></i>
<i data-lucide="mail" style="width:24px;height:24px"></i>
<i data-lucide="search" style="width:24px;height:24px"></i>
<i data-lucide="filter" style="width:24px;height:24px"></i>
<i data-lucide="external-link" style="width:24px;height:24px"></i>
</div>
<div class="row" style="gap:14px;align-items:center">
<i data-lucide="arrow-up-right" style="width:16px;height:16px;color:var(--accent)"></i>
<span style="font-family:var(--font-mono);font-size:12px;color:var(--accent)">arrow-up-right · used on every Source link</span>
</div>
<script>lucide.createIcons();</script>
</div></body></html>
