<!doctype html><html><head><meta charset="utf-8"><title>Colors — Section tags</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="note">Section tags · low-chroma, pill use only</div>
<div class="row" style="gap:8px">
<span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--border);border-radius:999px;color:#2E2A22">TL;DR</span>
<span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--border);border-radius:999px;color:#8E2F08">Big Moves</span>
<span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--border);border-radius:999px;color:#1F4D3A">Enterprise Ops</span>
<span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--border);border-radius:999px;color:#2A3F6B">Vendors</span>
<span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--border);border-radius:999px;color:#6B2D2D">Security</span>
<span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--border);border-radius:999px;color:#4A3A1F">Policy</span>
<span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--border);border-radius:999px;color:#4A4A4A">Quick Hits</span>
</div>
<div style="font-family:var(--font-serif);font-size:14px;color:var(--fg-muted);font-style:italic">Each story sits under one tag. Color appears only inside the pill — never as a background fill.</div>
</div></body></html>
