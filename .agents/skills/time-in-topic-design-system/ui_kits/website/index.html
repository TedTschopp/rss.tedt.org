<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yesterday in AI — Today</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../_shared/data.js"></script>
<script src="../_shared/font-tweaks.js"></script>
<style>
  body { margin: 0; }
  .page { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 64px; padding-top: 16px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .rail { order: -1; } }
  .rail { position: sticky; top: 80px; align-self: start; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../_shared/Wordmark.jsx"></script>
<script type="text/babel" src="../_shared/tweaks-panel.jsx"></script>
<script type="text/babel" src="../_shared/Tweaks.jsx"></script>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "fontSet": "original",
  "accent": "#D9531E"
}/*EDITMODE-END*/;
function App() {
  const d = window.YIA_DATA;
  useEffect(() => { lucide.createIcons(); });
  return (
    <div>
      <YIATweaks defaults={TWEAK_DEFAULTS} />
      <Header />
      <div className="page">
        <Masthead edition={d.edition} />
        <div className="layout">
          <main>
            <TLDR items={d.tldr} />
            {d.sections.map((sec, i) => (
              <section key={sec.id} data-screen-label={`section-${sec.id}`}>
                <SectionHeader section={sec} idx={i+2} />
                {sec.stories.map((s, j) => <StoryCard key={j} story={s} />)}
              </section>
            ))}
            <QuickHits items={d.quickHits} />
            <LookingAhead items={d.ahead} />
          </main>
          <aside className="rail"><SubscribeBlock /></aside>
        </div>
        <Footer />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
