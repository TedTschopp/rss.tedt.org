# Site settings
title: RSS Feed Hub
tagline: Curated AI and technology feeds
description: > # this means to ignore newlines until "baseurl:"
  Curated AI, enterprise architecture, and technology RSS feeds from Ted Tschopp.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://rss.tedt.org" # the base hostname & protocol for your site
lang: en_US

# Jasper theme settings
name: 'RSS Feed Hub'
logo: assets/images/logo.png
favicon: assets/images/favicon.svg
image: assets/images/social-card.png
production_url: https://rss.tedt.org
source_url: https://github.com/TedTschopp/rss.tedt.org

# Social URLs
facebook_url:
twitter_url:
instagram_url:
github_url: https://github.com/TedTschopp/rss.tedt.org

author:
  name: Ted Tschopp
  url: https://rss.tedt.org/about.html

social:
  name: Ted Tschopp
  links:
  - https://rss.tedt.org
  - https://github.com/TedTschopp/rss.tedt.org

defaults:
- scope:
    path: ""
  values:
    image:
      path: /assets/images/social-card.png
      height: 909
      width: 1731
      alt: RSS Feed Hub - curated AI, enterprise architecture, and technology feeds

# Mailchimp newsletter
mailchimp_url:

# Disqus
disqus_identifier:

# Google Analytics
google_analytics:

# Authors
authors:
  ted:
    name: Ted
    display_name: Ted
    avatar: # 'assets/images/avatar.png' # Uncomment when avatar is added
    web: https://rss.tedt.org
    description: "RSS feed curator and automation enthusiast"

# Plugins
plugins:
- jekyll-paginate
- jekyll-sitemap
- jekyll-feed
- jekyll-seo-tag

# Pagination
paginate: 6
paginate_path: /page:num/

# Exclude from processing
exclude:
- Gemfile
- Gemfile.lock
- node_modules
- vendor/bundle/
- vendor/cache/
- vendor/gems/
- vendor/ruby/
- scripts/
- pipeline/
- Docs/
- derived/
- raw/
- reports/
- prompts/
- .agents/
- requirements.txt
- debug_*.html

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Gems
gems:
- jekyll-paginate
- jekyll-sitemap
- jekyll-feed
- jekyll-seo-tag

###############################################
# Unified feeds (direct + aggregated)
# Fields:
# - name, url, description (direct)
# - aggregated: true (for aggregated feeds)
# - key, output, enabled, sources, max_items, retention_days, source_attribution (aggregated only)
# - formats: alternate feed format URLs (rss1, atom, json)
###############################################
feeds:
- name: "Ted Tschopp's AI News"
  url: "/ai_rss_feed.xml"
  description: "Latest AI News and Ratings from Ted Tschopp"
  formats:
    rss2: "/ai_rss_feed.xml"
    rss1: "/ai_rss_feed_rss1.xml"
    atom: "/ai_rss_feed.atom"
    json: "/ai_rss_feed.json"

- name: "Wes's AI News"
  aggregated: true
  key: aggregated_wes_ai_news
  enabled: true
  output: "/aggregated_wes_ai_news.xml"
  url: "/aggregated_wes_ai_news.xml"
  title: "Wes's AI News"
  link: "https://rss.tedt.org/aggregated_wes_ai_news.xml"
  description: "Latest AI News and Commentary from Wes"
  max_items: 100
  retention_days: 60
  source_attribution: none
  sources:
  - "https://natural20.com/feed.xml"
  formats:
    rss2: "/aggregated_wes_ai_news.xml"
    rss1: "/aggregated_wes_ai_news_rss1.xml"
    atom: "/aggregated_wes_ai_news.atom"
    json: "/aggregated_wes_ai_news.json"

- name: "Top Stories (LLM Aggregated)"
  url: "/feeds/top.xml"
  description: "Cross-source ranked stories with optional GitHub Models enrichment"
  formats:
    rss2: "/feeds/top.xml"
    rss1: "/feeds/top_rss1.xml"
    atom: "/feeds/top.atom"
    json: "/feeds/top.json"

- name: "Aggregated External Tech News"
  aggregated: true
  key: aggregated_external
  enabled: false
  output: "/aggregated_external.xml"
  url: "/aggregated_external.xml"
  title: "Aggregated External AI & Tech News"
  link: "https://rss.tedt.org/aggregated_external.xml"
  description: "Merged headlines from configured external sources"
  max_items: 150
  retention_days: 60
  source_attribution: title
  sources:
  - "https://feeds.arstechnica.com/arstechnica/technology-lab"
  - "https://www.infoworld.com/index.rss"
  - "https://www.techrepublic.com/rssfeeds/articles/"
  - "https://www.zdnet.com/news/rss.xml"

- name: "Enterprise Architecture Aggregated News"
  aggregated: true
  key: aggregated_ea
  enabled: true
  output: "/aggregated_ea.xml"
  url: "/aggregated_ea.xml"
  formats:
    rss2: "/aggregated_ea.xml"
    rss1: "/aggregated_ea_rss1.xml"
    atom: "/aggregated_ea.atom"
    json: "/aggregated_ea.json"
  title: "Enterprise Architecture Aggregated News"
  link: "https://rss.tedt.org/aggregated_ea.xml"
  description: "Enterprise Architecture multi-source aggregated feed"
  max_items: 150
  retention_days: 60
  source_attribution: title
  sources:
  - "https://bizzdesign.com/blog/feed"
  - "https://blog.opengroup.org/feed"
  - "https://eapj.org/feed"
  - "https://feed.infoq.com/enterprise-architecture"
  - "https://www.architectureandgovernance.com/elevating-ea/feed/"
  - "https://www.forrester.com/blogs/category/enterprise-architecture/feed/"
  - "https://www.leanix.net/en/blog/rss.xml"

- name: "Ted Tschopp's Digital Exhaust"
  aggregated: true
  key: aggregated_teds_digital_exhaust
  enabled: false
  output: "/aggregated_teds_digital_exhaust.xml"
  url: "/aggregated_teds_digital_exhaust.xml"
  title: "Ted Tschopp's Digital Exhaust"
  link: "https://rss.tedt.org/aggregated_teds_digital_exhaust.xml"
  description: "Ted Tschopp's Digital Exhaust multi-source aggregated feed"
  max_items: 150
  retention_days: 60
  source_attribution: title
  sources:
  - "https://www.yelp.com/syndicate/user/ukkYfZcwUj3ZW75Mkmo4_g/rss.xml"
  - "https://feeds.feedburner.com/truesteamachievements/ctS0AH9xdJX"
  - "https://www.trueachievements.com/friendfeedrss.aspx%3Fgamerid%3D1106059&re=metadata&out=atom"
  - "https://lfm.xiffy.nl/TedTschopp"
  - "https://www.reddit.com/user/TedTschopp/submitted/.rss"
  - "https://www.reddit.com/user/TedTschopp/comments/.rss"

- name: "Broad AI News"
  aggregated: true
  key: aggregated_broad_ai_news
  enabled: true
  output: "/aggregated_broad_ai_news.xml"
  url: "/aggregated_broad_ai_news.xml"
  formats:
    rss2: "/aggregated_broad_ai_news.xml"
    rss1: "/aggregated_broad_ai_news_rss1.xml"
    atom: "/aggregated_broad_ai_news.atom"
    json: "/aggregated_broad_ai_news.json"
  title: "Broad AI News"
  link: "https://rss.tedt.org/aggregated_broad_ai_news.xml"
  description: "Broad AI ecosystem signals from labs, research, communities, and newsletters"
  max_items: 200
  retention_days: 365
  source_attribution: title
  sources:
  # AI Labs
  - url: "https://openai.com/news/rss.xml"
    category: "AI Labs"
  - url: "https://deepmind.com/blog/feed/basic"
    category: "AI Labs"
  - url: "https://news.google.com/rss/search?q=Anthropic+AI"
    category: "AI Labs"
  - url: "https://news.google.com/rss/search?q=xAI+AI"
    category: "AI Labs"
  - url: "https://news.google.com/rss/search?q=Sam+Altman+AI"
    category: "AI Labs"
  - url: "https://news.google.com/rss/search?q=Dario+Amodei+AI"
    category: "AI Labs"
  # Hacker News
  - url: "https://hnrss.org/frontpage"
    category: "Hacker News"
  - url: "https://hnrss.org/newest"
    category: "Hacker News"
  # Reddit
  - url: "https://www.reddit.com/r/MachineLearning/.rss"
    category: "Reddit"
  - url: "https://www.reddit.com/r/artificial/.rss"
    category: "Reddit"
  - url: "https://www.reddit.com/r/LocalLLaMA/.rss"
    category: "Reddit"
  - url: "https://www.reddit.com/r/singularity/.rss"
    category: "Reddit"
  - url: "https://www.reddit.com/r/ChatGPT/.rss"
    category: "Reddit"
  # arXiv AI Categories
  - url: "https://export.arxiv.org/rss/cs.AI"
    category: "arXiv AI Categories"
  - url: "https://export.arxiv.org/rss/cs.CL"
    category: "arXiv AI Categories"
  - url: "https://export.arxiv.org/rss/cs.LG"
    category: "arXiv AI Categories"
  # Newsletters
  - url: "https://magazine.sebastianraschka.com/feed"
    category: "Newsletters"
  - url: "https://aisnakeoil.substack.com/feed"
    category: "Newsletters"
  - url: "https://oneusefulthing.substack.com/feed"
    category: "Newsletters"
  # Extras
  - url: "https://aiweekly.co/issues.rss"
    category: "Extras"
  - url: "https://www.marktechpost.com/feed"
    category: "Extras"

# Backward compatibility aliases (legacy templates/scripts)
rss_feeds:
- name: "Ted Tschopp's AI News"
  url: "/ai_rss_feed.xml"
  description: "Latest AI News and Ratings from Ted Tschopp"
- name: "Wes's AI News"
  url: "/aggregated_wes_ai_news.xml"
  description: "Latest AI News and Commentary from Wes"
- name: "Aggregated External Tech News"
  url: "/aggregated_external.xml"
