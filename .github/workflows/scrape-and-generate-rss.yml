name: RSS Feed Hub - Scrape and Deploy

on:
  schedule:
    # Light run every 8 hours
    - cron: '0 */8 * * *'
    # Heavy run once daily for deeper enrichment/cleanup
    - cron: '30 3 * * *'
  workflow_dispatch:
    # Allow manual triggering
  push:
    branches: [ main ]

jobs:
  scrape-and-generate-rss:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' }}
    timeout-minutes: 180

    concurrency:
      group: "scrape-${{ github.workflow }}"
      cancel-in-progress: ${{ github.event_name == 'schedule' }}
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    outputs:
      rss-updated: ${{ steps.check-changes.outputs.changes-detected }}
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-chromium-v1

    - name: Install Playwright browser binaries
      if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' && !(github.event_name == 'schedule' && github.event.schedule != '30 3 * * *') }}
      run: python -m playwright install --with-deps chromium
        
    - name: Run scraper and generate RSS
      run: python -m scripts.enhanced_scraper
      env:
        DEBUG: "false"
        GAI_SCRAPE_ENABLED: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && 'false' || 'true' }}

    - name: Run full aggregation pipeline
      run: python -m pipeline.run_all
      env:
        GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || secrets.GH_Models_Token }}
        # Light mode for the 8-hour schedule; heavy mode for daily schedule and manual runs.
        PIPELINE_LLM_TOP_N: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '20' || '50' }}
        PIPELINE_LLM_CHAT_MAX_CALLS: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '10' || '25' }}
        PIPELINE_PUBLISH_TOP_N: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '80' || '200' }}
        PIPELINE_OUTPUT_CLEANUP_ENABLED: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && 'false' || 'true' }}
        PIPELINE_OUTPUT_CLEANUP_TOP_N: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '0' || '200' }}
        PIPELINE_IMPORTANCE_BACKFILL_DAYS: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '2' || '7' }}
        PIPELINE_LLM_RETRY_MAX_ATTEMPTS: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '2' || '4' }}
        PIPELINE_LLM_RETRY_BASE_DELAY_SEC: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '1.0' || '1.5' }}
        PIPELINE_LLM_RETRY_MAX_DELAY_SEC: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '8.0' || '20.0' }}
        PIPELINE_LLM_RETRY_JITTER_SEC: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '0.3' || '0.8' }}
        PIPELINE_LLM_429_WINDOW_SEC: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '30' || '60' }}
        PIPELINE_LLM_429_THRESHOLD: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '3' || '5' }}
        PIPELINE_LLM_429_COOLDOWN_BASE_SEC: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '10.0' || '45.0' }}
        PIPELINE_LLM_429_COOLDOWN_MAX_SEC: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '60.0' || '300.0' }}
        PIPELINE_ARTICLE_FETCH_WORKERS: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '3' || '6' }}
        PIPELINE_ARTICLE_CACHE_ENABLED: 'true'
        PIPELINE_ARTICLE_CACHE_TTL_HOURS: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '24' || '48' }}
        PIPELINE_ARTICLE_CACHE_PATH: derived/article_cache.json
      
    - name: Run RSS health monitoring
      run: python -m scripts.monitor

    - name: Check for RSS changes
      id: check-changes
      shell: bash
      run: |
        set -euo pipefail
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Keep JSONL runtime logs bounded to control repository growth and commit size.
        prune_jsonl() {
          local file_path="$1"
          local max_lines="$2"
          if [[ -f "$file_path" ]]; then
            tail -n "$max_lines" "$file_path" > "$file_path.tmp" || true
            mv "$file_path.tmp" "$file_path"
          fi
        }
        prune_jsonl "derived/fetch_log.jsonl" 5000
        prune_jsonl "derived/llm_call_log.jsonl" 10000

        # Stage only generated artifacts (avoid accidentally committing workflow/runtime files)
        shopt -s nullglob
        files=(
          *rss_feed*.xml
          *rss_feed*.atom
          *rss_feed*.json
          aggregated*.xml
          aggregated*.atom
          aggregated*.json
          api/*.json
          feeds/*
          data/*.json
          derived/*.json
          derived/*.jsonl
          reports/*.json
          reports/*.md
          reports/aggregation/*.json
          reports/aggregation/*.md
        )
        git add "${files[@]}"

        if git diff --staged --quiet; then
          echo "No changes to commit"
          echo "changes-detected=false" >> $GITHUB_OUTPUT
          echo "## RSS Feed Status 📡" >> $GITHUB_STEP_SUMMARY
          echo "No new RSS content detected in this run." >> $GITHUB_STEP_SUMMARY
        else
          echo "Changes detected, committing..."
          git commit -m "Update RSS feeds and status report - $(date -u)"
          git push
          echo "changes-detected=true" >> $GITHUB_OUTPUT
          echo "## RSS Feed Status 📡" >> $GITHUB_STEP_SUMMARY
          echo "✅ RSS feeds updated successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- Generated artifacts committed and pushed to repository" >> $GITHUB_STEP_SUMMARY
          echo "- Jekyll site will be rebuilt and deployed" >> $GITHUB_STEP_SUMMARY
        fi

  # Deploy on any push to main (deploy-only, no scraping)
  deploy-on-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' }}
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
        
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5
      
    - name: Build Jekyll site
      run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      env:
        JEKYLL_ENV: production
        
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      
    - name: Add deployment summary
      run: |
        echo "## Jekyll Site Deployment 🚀" >> $GITHUB_STEP_SUMMARY
        echo "✅ Jekyll site successfully deployed!" >> $GITHUB_STEP_SUMMARY
        echo "🌐 Site URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
        echo "📅 Deployed at: $(date -u)" >> $GITHUB_STEP_SUMMARY

  # Deploy after scheduled/manual scraping (runs even if scraping fails to keep Pages published)
  deploy-after-scrape:
    runs-on: ubuntu-latest
    needs: scrape-and-generate-rss
    if: ${{ always() && github.event_name != 'push' }}
    permissions:
      contents: read
      pages: write
      id-token: write

    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository (latest main)
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5

    - name: Build Jekyll site
      run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      env:
        JEKYLL_ENV: production

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Add deployment summary
      run: |
        echo "## Jekyll Site Deployment 🚀" >> $GITHUB_STEP_SUMMARY
        echo "✅ Jekyll site successfully deployed!" >> $GITHUB_STEP_SUMMARY
        echo "🌐 Site URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
        echo "📅 Deployed at: $(date -u)" >> $GITHUB_STEP_SUMMARY
