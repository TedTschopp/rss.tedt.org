name: RSS Feed Hub - Scrape and Deploy

on:
  schedule:
    # Light run every 8 hours
    - cron: '0 */8 * * *'
    # Heavy run once daily for deeper enrichment/cleanup
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: Process cached enrichment misses across the full active corpus
        required: false
        default: false
        type: boolean
      backfill_batch_size:
        description: Maximum model calls per enrichment stage
        required: false
        default: '250'
        type: choice
        options:
          - '250'
          - '500'
      continue_backfill:
        description: Queue another batch while the reported backlog is shrinking
        required: false
        default: false
        type: boolean
      backfill_runs_remaining:
        description: Maximum chained runs including this run
        required: false
        default: '16'
        type: string
  push:
    branches: [ main ]

jobs:
  scrape-and-generate-rss:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' }}
    timeout-minutes: 180

    concurrency:
      group: "scrape-${{ github.workflow }}"
      cancel-in-progress: false
    
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    
    outputs:
      rss-updated: ${{ steps.check-changes.outputs.changes-detected }}
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-chromium-v1

    - name: Install Playwright browser binaries
      if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' && !(github.event_name == 'schedule' && github.event.schedule != '30 3 * * *') }}
      run: python -m playwright install --with-deps chromium
        
    - name: Run scraper and generate RSS
      run: python -m scripts.enhanced_scraper
      env:
        DEBUG: "false"
        GAI_SCRAPE_ENABLED: "true"

    - name: Run full aggregation pipeline
      run: python -m pipeline.run_all
      env:
        GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || secrets.GH_Models_Token }}
        # Prefer OpenAI workload identity federation in Actions. OPENAI_API_KEY
        # remains a local/temporary fallback if WIF variables are not configured.
        PIPELINE_LLM_PROVIDER: 'openai'
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
        OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
        OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
        OPENAI_WIF_CLIENT_ID: ${{ vars.OPENAI_WIF_CLIENT_ID }}
        PIPELINE_OPENAI_RATE_LIMIT_REQUESTS_PER_MINUTE: '60'
        PIPELINE_OPENAI_DAILY_REQUEST_CAP: '0'
        PIPELINE_OPENAI_GLOBAL_DAILY_REQUEST_CAP: '0'
        # Light mode trims feed size/retries, but still performs missing LLM
        # transformations. Cached LLM outputs are reused by story/context hash.
        PIPELINE_BACKFILL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && 'true' || 'false' }}
        PIPELINE_LLM_TOP_N: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && '10000' || (github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '20' || '50') }}
        PIPELINE_LLM_EMBEDDING_BATCH_SIZE: '100'
        PIPELINE_LLM_EMBEDDING_MAX_STORIES: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && inputs.backfill_batch_size || '0' }}
        PIPELINE_LLM_CHAT_MAX_CALLS: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && inputs.backfill_batch_size || (github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '10' || '25') }}
        PIPELINE_LLM_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && '8' || '1' }}
        PIPELINE_PUBLISH_TOP_N: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && '10000' || (github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '80' || '200') }}
        PIPELINE_IMPORTANCE_MODEL: 'openai/gpt-4.1-mini'
        PIPELINE_GITHUB_MODELS_COPILOT_PLAN: 'copilot_enterprise'
        PIPELINE_GITHUB_MODELS_DAILY_BUDGET_ENABLED: 'true'
        PIPELINE_GITHUB_MODELS_DAILY_REQUEST_CAP: '12'
        PIPELINE_GITHUB_MODELS_GLOBAL_DAILY_REQUEST_CAP: '0'
        PIPELINE_GITHUB_MODELS_FAIL_FAST_AUTH: 'true'
        PIPELINE_OUTPUT_CLEANUP_ENABLED: 'true'
        PIPELINE_AI_RELEVANCE_MAX_CALLS: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && inputs.backfill_batch_size || '0' }}
        PIPELINE_IMPORTANCE_MAX_CALLS: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && inputs.backfill_batch_size || '0' }}
        PIPELINE_OUTPUT_CLEANUP_TOP_N: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && '10000' || (github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '20' || '50') }}
        PIPELINE_OUTPUT_CLEANUP_MAX_CALLS: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && inputs.backfill_batch_size || '0' }}
        PIPELINE_IMPORTANCE_BACKFILL_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && '36500' || '60' }}
        PIPELINE_LLM_RETRY_MAX_ATTEMPTS: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '2' || '4' }}
        PIPELINE_LLM_RETRY_BASE_DELAY_SEC: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '1.0' || '1.5' }}
        PIPELINE_LLM_RETRY_MAX_DELAY_SEC: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '8.0' || '20.0' }}
        PIPELINE_LLM_RETRY_JITTER_SEC: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '0.3' || '0.8' }}
        PIPELINE_LLM_429_WINDOW_SEC: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '30' || '60' }}
        PIPELINE_LLM_429_THRESHOLD: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '3' || '5' }}
        PIPELINE_LLM_429_COOLDOWN_BASE_SEC: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '10.0' || '45.0' }}
        PIPELINE_LLM_429_COOLDOWN_MAX_SEC: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '60.0' || '300.0' }}
        PIPELINE_ARTICLE_FETCH_WORKERS: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '3' || '6' }}
        PIPELINE_ARTICLE_FETCH_MAX_URLS: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && inputs.backfill_batch_size || '0' }}
        PIPELINE_ARTICLE_CACHE_ENABLED: 'true'
        PIPELINE_ARTICLE_CACHE_TTL_HOURS: ${{ github.event_name == 'schedule' && github.event.schedule != '30 3 * * *' && '24' || '48' }}
        PIPELINE_ARTICLE_CACHE_PATH: derived/article_cache.json
      
    - name: Run RSS health monitoring
      run: python -m scripts.monitor

    - name: Check for RSS changes
      id: check-changes
      shell: bash
      run: |
        set -euo pipefail
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Keep JSONL runtime logs bounded to control repository growth and commit size.
        prune_jsonl() {
          local file_path="$1"
          local max_lines="$2"
          if [[ -f "$file_path" ]]; then
            tail -n "$max_lines" "$file_path" > "$file_path.tmp" || true
            mv "$file_path.tmp" "$file_path"
          fi
        }
        prune_jsonl "derived/fetch_log.jsonl" 5000
        prune_jsonl "derived/llm_call_log.jsonl" 10000

        # Stage only generated artifacts (avoid accidentally committing workflow/runtime files)
        shopt -s nullglob
        files=(
          *rss_feed*.xml
          *rss_feed*.atom
          *rss_feed*.json
          aggregated*.xml
          aggregated*.atom
          aggregated*.json
          api/*.json
          feeds/*
          data/*.json
          derived/*.json
          derived/*.jsonl
          reports/*.json
          reports/*.md
          reports/aggregation/*.json
          reports/aggregation/*.md
        )
        git add "${files[@]}"

        MAX_STAGED_BLOB_BYTES=90000000
        oversized_blob=false
        while IFS= read -r -d '' staged_file; do
          if [[ ! -f "$staged_file" ]]; then
            continue
          fi
          staged_size=$(wc -c < "$staged_file")
          if (( staged_size > MAX_STAGED_BLOB_BYTES )); then
            echo "::error file=$staged_file::$staged_file is $staged_size bytes and exceeds the 90 MB workflow limit"
            oversized_blob=true
          fi
        done < <(git diff --staged --name-only --diff-filter=ACM -z)
        if [[ "$oversized_blob" == true ]]; then
          exit 1
        fi

        if git diff --staged --quiet; then
          echo "No changes to commit"
          echo "changes-detected=false" >> $GITHUB_OUTPUT
          echo "## RSS Feed Status 📡" >> $GITHUB_STEP_SUMMARY
          echo "No new RSS content detected in this run." >> $GITHUB_STEP_SUMMARY
        else
          echo "Changes detected, committing..."
          git commit -m "Update RSS feeds and status report - $(date -u)"
          git push
          echo "changes-detected=true" >> $GITHUB_OUTPUT
          echo "## RSS Feed Status 📡" >> $GITHUB_STEP_SUMMARY
          echo "✅ RSS feeds updated successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- Generated artifacts committed and pushed to repository" >> $GITHUB_STEP_SUMMARY
          echo "- Jekyll site will be rebuilt and deployed" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Evaluate backfill continuation
      id: backfill-continuation
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && inputs.continue_backfill }}
      env:
        BACKFILL_RUNS_REMAINING: ${{ inputs.backfill_runs_remaining }}
      run: |
        python -m scripts.backfill_continuation \
          reports/pipeline_report.json \
          --runs-remaining "$BACKFILL_RUNS_REMAINING" \
          --github-output "$GITHUB_OUTPUT"

    - name: Queue next backfill batch
      if: ${{ steps.backfill-continuation.outputs.should_continue == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
        BACKFILL_BATCH_SIZE: ${{ inputs.backfill_batch_size }}
        NEXT_RUNS_REMAINING: ${{ steps.backfill-continuation.outputs.next_runs_remaining }}
      run: |
        gh workflow run scrape-and-generate-rss.yml \
          --ref main \
          -f backfill=true \
          -f backfill_batch_size="$BACKFILL_BATCH_SIZE" \
          -f continue_backfill=true \
          -f backfill_runs_remaining="$NEXT_RUNS_REMAINING"

  # Deploy on any push to main (deploy-only, no scraping)
  deploy-on-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' }}
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
        
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5
      
    - name: Build Jekyll site
      run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      env:
        JEKYLL_ENV: production
        
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      
    - name: Add deployment summary
      run: |
        echo "## Jekyll Site Deployment 🚀" >> $GITHUB_STEP_SUMMARY
        echo "✅ Jekyll site successfully deployed!" >> $GITHUB_STEP_SUMMARY
        echo "🌐 Site URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
        echo "📅 Deployed at: $(date -u)" >> $GITHUB_STEP_SUMMARY

  # Deploy after scheduled/manual scraping (runs even if scraping fails to keep Pages published)
  deploy-after-scrape:
    runs-on: ubuntu-latest
    needs: scrape-and-generate-rss
    if: ${{ always() && github.event_name != 'push' }}
    permissions:
      contents: read
      pages: write
      id-token: write

    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository (latest main)
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5

    - name: Build Jekyll site
      run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      env:
        JEKYLL_ENV: production

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Add deployment summary
      run: |
        echo "## Jekyll Site Deployment 🚀" >> $GITHUB_STEP_SUMMARY
        echo "✅ Jekyll site successfully deployed!" >> $GITHUB_STEP_SUMMARY
        echo "🌐 Site URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
        echo "📅 Deployed at: $(date -u)" >> $GITHUB_STEP_SUMMARY
