<!doctype html><html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .wm { display:inline-flex; align-items:baseline; gap:8px; line-height:1; white-space:nowrap; color:var(--fg); }
  .wm-serif { font-family:var(--font-serif); font-weight:700; font-size:42px; letter-spacing:-0.03em; }
  .wm-slash { display:inline-block; width:2px; height:34px; background:var(--accent); transform:rotate(18deg); border-radius:1px; }
  .wm-sans { font-family:var(--font-sans); font-weight:500; font-size:28px; letter-spacing:-0.01em; }
  .wm-inv { color:var(--ink-0); }
  .mono { display:inline-flex; align-items:center; justify-content:center; width:64px; height:64px; border:2px solid var(--ink-0); color:var(--ink-0); font-family:var(--font-serif); font-weight:700; font-size:34px; line-height:1; letter-spacing:-0.04em; border-radius:var(--r-2); }
</style>
</head>
<body><div class="card" style="gap:24px">
  <div class="col" style="gap:14px">
    <div class="note">Wordmark · light</div>
    <div style="background:var(--bg);padding:18px 24px;border:1px solid var(--border-soft);border-radius:var(--r-3);display:flex;align-items:center">
      <span class="wm">
        <span class="wm-serif">Yesterday</span>
        <span class="wm-slash"></span>
        <span class="wm-sans">in AI</span>
      </span>
    </div>
  </div>
  <div class="col" style="gap:14px">
    <div class="note">Wordmark · inverse · monogram</div>
    <div style="background:var(--ink-900);padding:18px 24px;border-radius:var(--r-3);display:flex;align-items:center;gap:28px">
      <span class="wm wm-inv">
        <span class="wm-serif">Yesterday</span>
        <span class="wm-slash"></span>
        <span class="wm-sans">in AI</span>
      </span>
      <span class="mono">Y/</span>
    </div>
  </div>
</div></body></html>
