<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title><link rel="stylesheet" href="_card.css">
<style>
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);font-weight:500;font-size:14px;padding:10px 16px;border-radius:4px;border:1px solid transparent;cursor:pointer;transition:all 120ms cubic-bezier(.2,.6,.2,1)}
.btn-primary{background:var(--ink-900);color:var(--ink-0)}
.btn-primary:hover{background:#000}
.btn-secondary{background:var(--bg);color:var(--fg);border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--bg-subtle)}
.btn-ghost{background:transparent;color:var(--fg);padding:10px 12px}
.btn-ghost:hover{background:var(--bg-subtle)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent-hover)}
.btn-sm{font-size:13px;padding:7px 12px}
</style></head>
<body><div class="card">
<div class="note">Buttons · default state</div>
<div class="row" style="gap:10px">
<button class="btn btn-primary">Subscribe</button>
<button class="btn btn-secondary">Read story</button>
<button class="btn btn-accent">Source ↗</button>
<button class="btn btn-ghost">Skip</button>
</div>
<div class="note">Sizes</div>
<div class="row" style="gap:10px;align-items:center">
<button class="btn btn-primary btn-sm">Small</button>
<button class="btn btn-primary">Default</button>
</div>
</div></body></html>
