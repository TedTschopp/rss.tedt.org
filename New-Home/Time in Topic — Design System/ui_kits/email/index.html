<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yesterday in AI — Daily Email</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_shared/data.js"></script>
<style>
body { margin:0; background: var(--bg-subtle); padding-bottom: 60px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../_shared/Wordmark.jsx"></script>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel">
function App(){
  const d = window.YIA_DATA;
  const featured = [
    { story: d.sections[0].stories[0], section: d.sections[0] },
    { story: d.sections[1].stories[0], section: d.sections[1] },
    { story: d.sections[2].stories[0], section: d.sections[2] },
  ];
  return (
    <InboxFrame>
      <EmailHeader edition={d.edition} />
      <EmailMasthead />
      <EmailTLDR items={d.tldr} />
      {featured.map((f,i)=>(<EmailStory key={i} story={f.story} section={f.section} index={i+1} />))}
      <EmailQuickHits items={d.quickHits.slice(0,4)} />
      <EmailLookingAhead items={d.ahead} />
      <EmailSignoff />
      <EmailFooter />
    </InboxFrame>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
