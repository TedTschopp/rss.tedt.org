<!doctype html><html><head><meta charset="utf-8"><title>Colors — Semantic</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="note">Semantic surfaces & text</div>
<div class="row" style="gap:14px">
<div class="tile"><div class="swatch" style="background:var(--bg)"></div><div class="sw-name">--bg</div><div class="sw-label">page</div></div>
<div class="tile"><div class="swatch" style="background:var(--bg-elev);border:1px solid var(--border)"></div><div class="sw-name">--bg-elev</div><div class="sw-label">card</div></div>
<div class="tile"><div class="swatch" style="background:var(--bg-subtle)"></div><div class="sw-name">--bg-subtle</div><div class="sw-label">fill</div></div>
<div class="tile"><div class="swatch" style="background:var(--bg-inverse)"></div><div class="sw-name">--bg-inverse</div><div class="sw-label">dark</div></div>
</div>
<div class="row" style="gap:18px;align-items:flex-end">
<div style="font-family:var(--font-sans);font-size:18px;font-weight:600;color:var(--fg)">Aa fg</div>
<div style="font-family:var(--font-sans);font-size:18px;color:var(--fg-body)">Aa fg-body</div>
<div style="font-family:var(--font-sans);font-size:18px;color:var(--fg-muted)">Aa fg-muted</div>
<div style="font-family:var(--font-sans);font-size:18px;color:var(--fg-faint)">Aa fg-faint</div>
<div style="background:var(--ink-900);padding:6px 10px;border-radius:4px;font-family:var(--font-sans);font-size:18px;color:var(--fg-on-dark)">Aa on-dark</div>
</div>
</div></body></html>
