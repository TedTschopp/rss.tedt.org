<!doctype html><html><head><meta charset="utf-8"><title>Radii & shadow</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="note">Radii · mostly square</div>
<div class="row" style="gap:14px">
<div class="tile"><div class="swatch" style="background:var(--bg-elev);border:1px solid var(--border);border-radius:0"></div><div class="sw-name">r-0</div><div class="sw-label">0px</div></div>
<div class="tile"><div class="swatch" style="background:var(--bg-elev);border:1px solid var(--border);border-radius:2px"></div><div class="sw-name">r-1</div><div class="sw-label">2px · default</div></div>
<div class="tile"><div class="swatch" style="background:var(--bg-elev);border:1px solid var(--border);border-radius:4px"></div><div class="sw-name">r-2</div><div class="sw-label">4px · buttons</div></div>
<div class="tile"><div class="swatch" style="background:var(--bg-elev);border:1px solid var(--border);border-radius:8px"></div><div class="sw-name">r-3</div><div class="sw-label">8px · cards</div></div>
<div class="tile"><div class="swatch" style="background:var(--bg-elev);border:1px solid var(--border);border-radius:999px"></div><div class="sw-name">r-pill</div><div class="sw-label">tags only</div></div>
</div>
<div class="note" style="margin-top:8px">Shadow · sparing</div>
<div class="row" style="gap:14px">
<div class="tile"><div class="swatch" style="background:#fff;box-shadow:0 1px 0 rgba(20,17,11,.04),0 1px 2px rgba(20,17,11,.06)"></div><div class="sw-name">shadow-1</div></div>
<div class="tile"><div class="swatch" style="background:#fff;box-shadow:0 2px 4px rgba(20,17,11,.05),0 4px 12px rgba(20,17,11,.06)"></div><div class="sw-name">shadow-2</div></div>
<div class="tile"><div class="swatch" style="background:#fff;box-shadow:0 12px 32px rgba(20,17,11,.10),0 2px 6px rgba(20,17,11,.06)"></div><div class="sw-name">shadow-pop</div></div>
</div>
</div></body></html>
