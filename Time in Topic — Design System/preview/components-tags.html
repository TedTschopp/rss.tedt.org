<!doctype html><html><head><meta charset="utf-8"><title>Tags & badges</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="note">Pills · status & filter</div>
<div class="row" style="gap:8px">
<span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--border);border-radius:999px;color:var(--fg-muted)">All</span>
<span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;background:var(--ink-900);color:var(--ink-0);border-radius:999px">Active</span>
<span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--accent);color:var(--accent);border-radius:999px">New</span>
<span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;background:var(--accent);color:#fff;border-radius:999px">3 unread</span>
</div>
<div class="note">Inline meta</div>
<div class="row" style="gap:14px;font-family:var(--font-mono);font-size:12px;color:var(--fg-muted)">
<span>● apr 29</span><span>· 5 min</span><span>· 12 stories</span><span>· vol 184</span>
</div>
</div></body></html>
